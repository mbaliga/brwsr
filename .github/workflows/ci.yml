name: CI

# Unit tests, the injected-script tests in headless Chromium, lint, and a debug APK that is
# published to a rolling prerelease ("brwsr-latest") for a stable sideload link.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        # Only platform-tools here: the action's default package list still asks for the legacy
        # 'tools' package, which Google no longer serves (same fix as shared-libraries' CI).
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests (filter engine, URL input, geometry)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Injected script tests (headless Chromium)
        working-directory: tools/js-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node injected-scripts.test.js

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/brwsr-debug.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: brwsr-debug-apk
          path: dist/brwsr-debug.apk
          if-no-files-found: error

      - name: Publish to rolling prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brwsr-latest
          name: brwsr — latest debug build
          body: |
            Auto-built debug APK of **brwsr**. Sideload `brwsr-debug.apk`.
            Built from `${{ github.sha }}`.
          prerelease: true
          files: dist/brwsr-debug.apk
